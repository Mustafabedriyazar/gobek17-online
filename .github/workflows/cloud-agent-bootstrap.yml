name: Cloud Agent upgrade carrier

# KURULUM / YUKSELTME TASIYICISI — elle tetiklenir, zamanlanmis calisma YOK.
#
# ADIM 1 payload'i: maintenance lane + izole self-edit + zorunlu self-test
# + self-brick boot smoke + restart-safe self-update durum makinesi.
#
# Akis:
#   1) main uzerinde temiz checkout
#   2) _self_repo.py uretilir (github.repository) — ajan kendi reposunu bilir
#   3) payload acilir ve uygulanir
#   4) tam self-test suite + boot smoke CALISTIRILIR
#   5) ucu de PASS ise YALNIZ cloud-agent/ altindaki dosyalar commit edilir
#      ve main'e normal (fast-forward) push edilir
#
# FAIL olursa hicbir sey commit/push edilmez.
# force / reset --hard / history rewrite / branch delete KULLANILMAZ.
# Token loglanmaz; payload sir icermez.
#
# Bu tasiyici ADIM 1 icin son manuel kurulumdur. Sonrasinda ajan kendi
# maintenance guncellemelerini kendisi yapar.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-agent-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repo duzenini dogrula
        run: |
          set -euo pipefail
          test -d cloud-agent/g17cloud || { echo "HATA: cloud-agent/g17cloud yok"; exit 1; }
          test -d cloud-agent/guards   || { echo "HATA: cloud-agent/guards yok"; exit 1; }
          test -f cloud-agent/tests/run_tests.py || { echo "HATA: Asama A suite yok"; exit 1; }
          python3 --version

      - name: Ajan reposunu koda yaz
        env:
          SELF_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '# Kurulumda uretildi. Sir icermez.\nSELF_REPO = "%s"\n' "$SELF_REPO" \
            > cloud-agent/g17cloud/_self_repo.py
          cat cloud-agent/g17cloud/_self_repo.py

