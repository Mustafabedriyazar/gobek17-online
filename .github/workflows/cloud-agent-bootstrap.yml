name: Cloud Agent upgrade carrier

# YUKSELTME TASIYICISI — elle tetiklenir, zamanlanmis calisma YOK.
#
# Bu kosunun yuku: parse_json_block dayanikliligi + AI API hata govdesi.
#
# 21 Agustos gecesi maintenance gorevleri dort farkli belirtiyle dustu:
#   Unterminated string / JSON bulunamadi / Expecting property name / HTTP 400
# Kok neden: parser ILK kod blogunu alip "ilk { ... son }" arasini kesiyordu,
# ve hata mesajinda ham cikti YOKTU. Bu yuk ikisini de duzeltir.
#
# FAIL olursa hicbir sey commit/push edilmez.
# force / reset --hard / history rewrite / branch delete KULLANILMAZ.
# Token loglanmaz; yuk sir icermez.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-agent-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repo duzenini dogrula
        run: |
          set -euo pipefail
          test -f cloud-agent/g17cloud/ai_worker.py || { echo "HATA: ai_worker.py yok"; exit 1; }
          test -f cloud-agent/tests/run_tests.py || { echo "HATA: test suite yok"; exit 1; }
          python3 --version

