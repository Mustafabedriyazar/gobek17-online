name: Cloud Agent bootstrap (tek kullanimlik)

# TEK SEFERLIK KURULUM — elle tetiklenir, zamanlanmis calisma YOK.
#
# Ne yapar:
#   1) main uzerinde temiz checkout alir
#   2) gomulu payload'i acar: cloud-agent/tests/ (self-test suite) +
#      release_guard'a run_self_tests() eklenmesi
#   3) self-test suite'i CALISTIRIR
#   4) paket import + config load smoke calistirir
#   5) ucu de PASS ise YALNIZ cloud-agent/ altindaki beklenen dosyalari
#      commit edip main'e normal (fast-forward) push eder
#
# FAIL olursa hicbir sey commit edilmez, push edilmez.
# force / reset --hard / history rewrite / branch delete KULLANILMAZ.
# Token loglanmaz; payload icinde sir yoktur.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-agent-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python surumu
        run: python3 --version

      - name: Repo duzenini dogrula
        run: |
          set -euo pipefail
          test -d cloud-agent/g17cloud || { echo "HATA: cloud-agent/g17cloud yok"; exit 1; }
          test -d cloud-agent/guards   || { echo "HATA: cloud-agent/guards yok"; exit 1; }
          test -f cloud-agent/g17cloud/release_guard.py || { echo "HATA: release_guard.py yok"; exit 1; }
          echo "Repo duzeni tamam."

