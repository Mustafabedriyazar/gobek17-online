      - name: Yukseltmeyi uygula
        run: |
          set -euo pipefail
          python3 upgrade.py cloud-agent

      - name: Zorunlu self-test suite
        working-directory: cloud-agent
        env:
          G17_STATE_DIR: ${{ runner.temp }}/g17state
        run: |
          set -euo pipefail
          python3 tests/run_tests.py

      - name: Self-brick boot smoke
        working-directory: cloud-agent
        env:
          G17_STATE_DIR: ${{ runner.temp }}/g17smoke
          G17_DEV_MODE: "1"
        run: |
          set -euo pipefail
          python3 tests/smoke_boot.py

      - name: Artik dosyalari temizle
        run: |
          set -euo pipefail
          rm -f upgrade.py
          find cloud-agent -name '*.bak' -delete
          find cloud-agent -name '__pycache__' -type d -prune -exec rm -rf {} +
          rm -rf cloud-agent/.smoke-state

      - name: Beklenen dosyalari stage'le
        id: stage
        run: |
          set -euo pipefail
          git add -- cloud-agent
          UNEXPECTED=$(git diff --cached --name-only | grep -v -E '^cloud-agent/' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "HATA: cloud-agent/ disinda dosya staged:"
            echo "$UNEXPECTED"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Degisiklik yok."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff --cached --name-only
          fi

      - name: Commit ve push (fast-forward)
        if: steps.stage.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          git config user.name  "g17-bootstrap"
          git config user.email "g17-bootstrap@users.noreply.github.com"
          git diff --cached --check
          git commit -q -m "agent: parse_json_block dayanikliligi + AI API hata govdesi"
          git pull --ff-only origin main
          git push origin HEAD:main
          echo "Push tamam."

      - name: Ozet
        run: |
          echo "SONUC: self-test PASS, boot smoke PASS, degisiklik=${{ steps.stage.outputs.changed }}"
