          G17_PAYLOAD_EOF
          base64 -d payload.b64 | gunzip > bootstrap_selftest.py
          rm -f payload.b64
          python3 -c "compile(open('bootstrap_selftest.py').read(),'b','exec')"
          echo "Payload acildi ve sozdizimi dogrulandi."

      - name: Suite'i yaz, guard'i yamala, testleri calistir
        run: |
          set -euo pipefail
          python3 bootstrap_selftest.py cloud-agent

      - name: Import + config smoke
        working-directory: cloud-agent
        env:
          G17_STATE_DIR: ${{ runner.temp }}/g17state
        run: |
          set -euo pipefail
          python3 - <<'SMOKE'
          import importlib
          mods = ["g17cloud.config", "g17cloud.store", "g17cloud.github_core",
                  "g17cloud.release_guard", "g17cloud.production",
                  "g17cloud.ai_worker", "g17cloud.pipeline", "g17cloud.api"]
          for m in mods:
              importlib.import_module(m)
              print("import OK:", m)
          from g17cloud.config import Config
          c = Config()
          c.ensure_dirs()
          d = c.public_dict()
          assert "githubTokenPresent" in d
          print("config OK:", d["name"], d["version"])
          SMOKE

      - name: Artik dosyalari temizle
        run: |
          set -euo pipefail
          rm -f bootstrap_selftest.py
          find cloud-agent -name '*.bak' -delete
          find cloud-agent -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "Temizlik tamam."

      - name: Beklenen dosyalari stage'le
        id: stage
        run: |
          set -euo pipefail
          git add -- cloud-agent/tests cloud-agent/g17cloud/release_guard.py
          UNEXPECTED=$(git diff --cached --name-only | grep -v -E '^cloud-agent/(tests/|g17cloud/release_guard[.]py$)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "HATA: beklenmeyen dosya staged:"
            echo "$UNEXPECTED"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Degisiklik yok — repo zaten guncel."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff --cached --name-only
          fi

      - name: Commit ve push (fast-forward)
        if: steps.stage.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          git config user.name  "g17-bootstrap"
          git config user.email "g17-bootstrap@users.noreply.github.com"
          git diff --cached --check
          git commit -q -m "agent: self-test suite + run_self_tests guard (tek seferlik bootstrap)"
          git pull --ff-only origin main
          git push origin HEAD:main
          echo "Push tamam."

      - name: Ozet
        run: |
          echo "SONUC: self-test PASS, smoke PASS, degisiklik=${{ steps.stage.outputs.changed }}"
