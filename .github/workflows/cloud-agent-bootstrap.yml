name: Cloud Agent upgrade carrier

# YUKSELTME TASIYICISI — elle tetiklenir, zamanlanmis calisma YOK.
#
# Bu kosunun yuku: Claude ABONELIGI (claude-cli) yolunu erisilebilir yapmak.
#
# Konsol "otomatik" secince API'ye requested="auto" gidiyordu; AIWorker.select
# icinde "auto" dolu sayildigi icin AI_PROVIDER degiskeni HIC okunmuyordu.
# Sonuc: hicbir gorev claude-cli'ye gidemiyor, her sey API'ye dusuyor ve
# bakiye bitince duruyordu. Bu yuk iki seyi yapar:
#   1) select(): "auto"/bos istek AI_PROVIDER'i gercekten dikkate alir
#   2) /ready: claudeCli { path, available } alani — CLI kurulu mu, gorunur
#
# Guvenlik mimarisine DOKUNULMAZ: tool allowlist, DENY, izole worktree,
# apply_edits, path guard, self-test, boot smoke, LKG, pipeline-owned push.
#
# FAIL olursa hicbir sey commit/push edilmez.
# force / reset --hard / history rewrite / branch delete KULLANILMAZ.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-agent-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repo duzenini dogrula
        run: |
          set -euo pipefail
          test -f cloud-agent/g17cloud/ai_worker.py || { echo "HATA: ai_worker.py yok"; exit 1; }
          test -f cloud-agent/g17cloud/api.py || { echo "HATA: api.py yok"; exit 1; }
          test -f cloud-agent/tests/run_tests.py || { echo "HATA: test suite yok"; exit 1; }
          python3 --version

